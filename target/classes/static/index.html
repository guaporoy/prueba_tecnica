<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Productos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>Gestión de Productos</h1>

        <form id="form-producto">
            <input type="hidden" id="producto-id">

            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Ej: Queso Paipa" required>
            </div>

            <div class="campo">
                <label for="precio">Precio</label>
                <input type="number" id="precio" step="0.01" min="0" placeholder="Ej: 12500" required>
            </div>

            <div class="campo">
                <label for="stock">Stock</label>
                <input type="number" id="stock" min="0" placeholder="Ej: 30" required>
            </div>

            <div class="campo">
                <label for="categoria">Categoría</label>
                <input type="text" id="categoria" placeholder="Ej: Lácteos" required>
            </div>

            <div class="acciones-formulario">
                <button type="submit" id="btn-guardar">Guardar producto</button>
                <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar edición</button>
            </div>

            <p id="mensaje-error" class="error"></p>
        </form>

        <table id="tabla-productos">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Categoría</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla"></tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
